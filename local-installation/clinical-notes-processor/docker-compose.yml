# Clinical Notes Processor — runs the pre-built image from the HONEUR registry.
# No source code is needed. See README.md for full installation steps.
name: clinical-notes-processor

services:
  clinical-api:
    # The published image. Override the version via CLINICAL_IMAGE in .env.
    image: ${CLINICAL_IMAGE:-harbor.honeur.org/honeur/clinical-notes-processor:0.8.0}
    pull_policy: always
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST}
      - CLINICAL_OLLAMA_MODEL=${CLINICAL_OLLAMA_MODEL:-qwen3:8b}
      - CLINICAL_NOTES_DIR=/data/notes
      - CLINICAL_DB_PATH=/data/registry/registry.db
      - CLINICAL_RAW_QA_EXTRA_MODELS=${CLINICAL_RAW_QA_EXTRA_MODELS:-}
      - CLINICAL_RAW_QA_CHUNK_CHARS=${CLINICAL_RAW_QA_CHUNK_CHARS:-8000}
      - CLINICAL_RAW_QA_CHUNK_OVERLAP_CHARS=${CLINICAL_RAW_QA_CHUNK_OVERLAP_CHARS:-500}
      - CLINICAL_CHUNKED_QA_CHUNK_CHARS=${CLINICAL_CHUNKED_QA_CHUNK_CHARS:-16000}
      - CLINICAL_CHUNKED_QA_CHUNK_OVERLAP_CHARS=${CLINICAL_CHUNKED_QA_CHUNK_OVERLAP_CHARS:-500}
    volumes:
      # Patient notes, mounted read-only. Put one subfolder per patient under this host folder.
      - ${CLINICAL_NOTES_HOST_DIR:-./notes}:/data/notes:ro
      - registry-data:/data/registry
    ports:
      - "8000:8000"
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    depends_on:
      - clinical-api
    environment:
      - OPENAI_API_BASE_URL=http://clinical-api:8000/v1
      - OPENAI_API_KEY=local
      - ENABLE_OLLAMA_API=false
      - WEBUI_AUTH=true
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      # Raised from Open WebUI's default so slow raw-model cohort questions (many
      # sequential reasoning-enabled calls) don't get cut off mid-stream. Verify this is
      # still the correct env var / large enough for your Open WebUI version if a raw
      # cohort request still fails with a transfer/stream error.
      - AIOHTTP_CLIENT_TIMEOUT=1800
    volumes:
      - open-webui-data:/app/backend/data
    ports:
      - "3000:8080"
    restart: unless-stopped

volumes:
  registry-data:
  open-webui-data:
